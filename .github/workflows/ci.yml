name: Saucedemo UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  # ─── 1. Build ──────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Check code formatting
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck

      - name: Compile test classes
        run: ./gradlew testClasses

  # ─── 2. Test ───────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Run tests (Chrome + Firefox headless)
        run: |
          chmod +x gradlew
          ./gradlew testAllBrowsers -Pheadless=true

      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: build/allure-results/
          retention-days: 7

  # ─── 3. Report ─────────────────────────────────────────────────────────────
  report:
    name: Report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}reports/${{ github.run_number }}/
    steps:
      - uses: actions/checkout@v4

      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Install Allure CLI
        run: npm install -g allure-commandline --quiet

      - name: Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      - name: Save report to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: reports/${{ github.run_number }}
          publish_branch: gh-pages
          keep_files: true

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: full-site

      - uses: actions/configure-pages@v4

      - name: Upload full site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: full-site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Print report URL
        run: |
          echo "## Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "🔗 ${{ steps.deploy.outputs.page_url }}reports/${{ github.run_number }}/" >> $GITHUB_STEP_SUMMARY
